# Training configuration. Every experiment is a change to this file:
# which features, which models, which hyperparameters.
training:
  seed: 42
  model_version: "2.0.0"
  selection_metric: pr_auc       # the model with the best validation value is served
  bootstrap_samples: 500         # for 95% confidence intervals on the test set
  review_fraction: 0.01          # share of subscribers analysts can review per snapshot
  threshold_grid:
    start: 0.01
    stop: 0.99
    step: 0.01

features:
  groups: [customer, usage, recharge, network, risk]
  windows: [7, 30, 90]

models:
  logistic_regression:
    C: 0.05
    class_weight: balanced
    max_iter: 3000
  xgboost:
    n_estimators: 300
    max_depth: 3
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.5
    min_child_weight: 5

tracking:
  enabled: true
  experiment_name: autoevolve-x
  # tracking_uri: sqlite:///mlflow.db   # default; override with MLFLOW_TRACKING_URI

ablation:
  model: xgboost
  bootstrap_samples: 500

agent:
  max_iterations: 6
  min_gain: 0.01        # smallest validation PR-AUC gain worth adopting
  bootstrap_samples: 300