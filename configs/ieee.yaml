# IEEE-CIS (real e-commerce fraud) configuration. Use with AUTOEVOLVE_DATASET=ieee.
# Training configuration. Every experiment is a change to this file:
# which features, which models, which hyperparameters.
training:
  seed: 42
  model_version: "ieee-1.0.0"
  selection: utility             # utility: the judge decides (see `judge:`); pr_auc: best validation score wins
  selection_metric: pr_auc       # used when selection is pr_auc, and reported either way
  # Models trained by scripts.train_models (the served model is the best of these on validation).
  # Every entry must have a block under `models:` below. Remove names to speed up CI.
  candidates: [logistic_regression, xgboost, lightgbm, hist_gradient_boosting, catboost]
  bootstrap_samples: 500         # for 95% confidence intervals on the test set
  review_fraction: 0.02          # share of subscribers analysts can review per snapshot
  threshold_grid:
    start: 0.01
    stop: 0.99
    step: 0.01

# What a decision is worth, used by the judge to pick the served model. These prices are
# assumptions: replace them with your own costs. Utility is reported per 10,000 accounts scored.
judge:
  fraud_value: 400            # money saved for each fraud caught
  review_cost: 6              # analyst time per reviewed account
  false_alarm_cost: 3         # extra customer friction per wrongly flagged account
  require_explanations: true  # the API returns reasons, so the served model must be able to explain
  max_point_loss: 0.10        # a tied model may be at most 10% below the best utility

features:
  groups: [transaction, card, address, email, counts, timedeltas, match, vesta, identity, device, history]
  windows: [7]                    # IEEE-CIS has no time windows; one placeholder keeps the agent's spec valid

models:
  logistic_regression:
    C: 0.05
    class_weight: balanced
    max_iter: 3000
  xgboost:
    n_estimators: 300
    max_depth: 3
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.5
    min_child_weight: 5
  random_forest:
    n_estimators: 300
    max_depth: 12
    min_samples_leaf: 20
    max_features: 0.1
  extra_trees:
    n_estimators: 300
    max_depth: 14
    min_samples_leaf: 20
    max_features: 0.2
  lightgbm:
    n_estimators: 300
    num_leaves: 8
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.5
    min_child_samples: 40
  hist_gradient_boosting:
    max_iter: 300
    max_depth: 3
    learning_rate: 0.05
    min_samples_leaf: 40
    l2_regularization: 1.0
  catboost:
    iterations: 300
    depth: 4
    learning_rate: 0.05
    l2_leaf_reg: 5.0
  isolation_forest:        # unsupervised: never sees labels; arena-only reality check
    n_estimators: 200
    max_samples: 1024
    max_features: 1.0

arena:
  # Compared by scripts.run_arena on TRAIN and VALIDATION snapshots only.
  models: [logistic_regression, xgboost, lightgbm, hist_gradient_boosting, catboost, random_forest]
  bootstrap_samples: 200
  workers: 1                  # >1 trains models in parallel on Ray (pip install ray)
  task_timeout_seconds: 1800  # a model still training after this is cancelled and reported as failed

tracking:
  enabled: true
  experiment_name: autoevolve-x
  # tracking_uri: sqlite:///mlflow.db   # default; override with MLFLOW_TRACKING_URI

ablation:
  model: xgboost
  bootstrap_samples: 500

agent:
  max_iterations: 6
  min_gain: 0.01        # smallest validation PR-AUC gain worth adopting
  llm_model: claude-sonnet-5-5   # model used by the language-model proposer and `scripts.ask --llm`; AUTOEVOLVE_LLM_MODEL overrides it
  bootstrap_samples: 300

agent_platform:
  # Hard limits for one agent run, enforced in code. The loop stops cleanly with a stated reason.
  max_llm_calls: 60
  max_input_tokens: 400000
  max_output_tokens: 60000
  max_cost_usd: 2.0
  max_seconds: 3600
  max_experiments: 15
  max_context_tokens: 6000        # budget for the evidence section of one prompt (estimated)
  price_per_mtok: {input: 3.0, output: 15.0}   # assumed US$ per million tokens; set to your plan's rates
  kill_switch_file: memory/STOP   # create this file to stop a running agent: touch memory/STOP
  trace_dir: memory/traces        # one JSONL trace file per run
  pushgateway_url: ""             # e.g. http://localhost:9091 ; the PUSHGATEWAY_URL environment variable overrides it
