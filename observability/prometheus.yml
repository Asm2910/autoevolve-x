global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: autoevolve-api
    metrics_path: /metrics
    static_configs:
      - targets: ["autoevolve-api:8000"]
  # Batch jobs (missions, reviews) push their final numbers here when they finish.
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
