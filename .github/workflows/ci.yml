name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m ruff check .
      # Data and models are git-ignored, so build them here. This takes about two minutes and
      # also proves that the whole pipeline still runs from a clean checkout.
      - name: Build the data and train the model
        env:
          # the small CI runner trains only the fast models; the full arena runs locally
          AUTOEVOLVE_CANDIDATES: logistic_regression,xgboost,lightgbm
        run: python -m scripts.run_pipeline
      - run: python -m pytest -q
      - name: Keep the trained model for the Docker job
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: models/artifacts
          if-no-files-found: error
          retention-days: 3

  docker:
    name: Build the API image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the trained model
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts
          path: models/artifacts
      - name: Check the compose file
        run: docker compose config -q
      - name: Build the image
        run: docker build -t autoevolve-x:ci .
      - name: Start it and wait for the health check
        run: |
          docker run -d --name api -p 8000:8000 autoevolve-x:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          docker logs api
          exit 1
